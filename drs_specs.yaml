# DIRECTORY DRS SPECIFICATIONS
directory:
  type: directory
  regex: '^[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/v[0-9]{8}$'
  separator: /
  parts:
    - source_collection: activity
      is_required: true

    - source_collection: product
      is_required: true

    - source_collection: domain
      is_required: true

    - source_collection: institute
      is_required: true

    - source_collection: driving_model
      is_required: true

    - source_collection: experiment
      is_required: true

    - source_collection: ensemble
      is_required: true

    - source_collection: rcm_model
      is_required: true

    - source_collection: rcm_version
      is_required: true

    - source_collection: time_frequency
      is_required: true

    - source_collection: variable
      is_required: true

    - source_collection: version
      is_required: true

# FILE NAME DRS SPECIFICATIONS
file_name:
  type: file_name
  regex: '^[A-Za-z0-9-]+_[A-Za-z0-9-]+_[A-Za-z0-9-]+_[A-Za-z0-9-]+_[A-Za-z0-9-]+_[A-Za-z0-9-]+_[A-Za-z0-9-]+_[A-Za-z0-9-]+(?:_[0-9]{6}-[0-9]{6})?\\.nc$'
  separator: _
  properties:
    extension: nc
    extension_separator: .
  parts:
    - source_collection: variable
      is_required: true

    - source_collection: domain
      is_required: true

    - source_collection: driving_model
      is_required: true

    - source_collection: experiment
      is_required: true

    - source_collection: ensemble
      is_required: true

    - source_collection: rcm_model
      is_required: true

    - source_collection: rcm_version
      is_required: true

    - source_collection: time_frequency
      is_required: true

    - source_collection: time_range
      is_required: false

# DATASET ID DRS SPECIFICATIONS
dataset_id:
  type: dataset_id
  regex: '^[A-Za-z0-9-]+\\.[A-Za-z0-9-]+\\.[A-Za-z0-9-]+\\.[A-Za-z0-9-]+\\.[A-Za-z0-9-]+\\.[A-Za-z0-9-]+\\.[A-Za-z0-9-]+\\.[A-Za-z0-9-]+\\.[A-Za-z0-9-]+\\.[A-Za-z0-9-]+$'
  separator: .
  parts:
    - source_collection: product
      is_required: true

    - source_collection: domain
      is_required: true

    - source_collection: institute
      is_required: true

    - source_collection: driving_model
      is_required: true

    - source_collection: experiment
      is_required: true

    - source_collection: ensemble
      is_required: true

    - source_collection: rcm_model
      is_required: true

    - source_collection: rcm_version
      is_required: true

    - source_collection: time_frequency
      is_required: true

    - source_collection: variable
      is_required: true
